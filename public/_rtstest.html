<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}canvas{width:1152px;height:648px;image-rendering:pixelated;display:block}</style>
<canvas id="c" width="384" height="216"></canvas>
<script type="module">
// page de test temporaire (à supprimer) : partie simulée puis rendu de la scène
import { RtsGame } from './js/rtsgame.js';
import { RtsScene } from './js/rts.js';
const q = new URLSearchParams(location.search);
const T = +(q.get('t') || 120), N = +(q.get('n') || 4);
await document.fonts.load('8px Silkscreen');
const realNow = Date.now.bind(Date);
let fake = realNow();
Date.now = () => fake;
const g = new RtsGame(Array.from({ length: N }, (_, i) => ({ key: 'p' + i, name: ['Django', 'Calamity', 'Bill', 'Jesse'][i], bot: true })));
let s = +(q.get('seed') || 5);
Math.random = () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) + 0x6d2b79f5 | 0) >>> 0) / 4294967296;
if (q.get('seed')) { g.seed = +q.get('seed'); }
const evs = g.start();
fake += 8500;
let snaps = [];
while (g.t < T * 1000) { fake += 100; for (const e of g.tick()) if (e.type === 'snap') snaps.push(e); }
const sc = new RtsScene(document.getElementById('c'), { send: () => {}, live: () => {} });
const st = g.syncView(0);
st.state = undefined;
sc.sync({ ...st, me: 0, elapsed: g.t });
const pz = (e) => ({ ...e, state: e.states[0] });
const last = snaps.slice(-2);
for (const e of last) sc.event(pz(e));
if (q.get('place')) { sc.placing = q.get('place'); Object.assign(sc.mouse, { x: +q.get('mx'), y: +q.get('my'), in: true }); }
if (q.get('hover')) Object.assign(sc.mouse, { x: +q.get('mx'), y: +q.get('my'), in: true });
window.__done = true;
</script>

<!doctype html><html><head><meta charset="utf-8"><title>Armes en main</title></head>
<body style="margin:0;background:#111;color:#ccc;font:11px monospace">
<div id="grid" style="display:flex;flex-wrap:wrap;gap:6px;padding:6px"></div>
<pre id="errlog" style="color:#f66"></pre>
<script type="module">
// Aperçu des armes en main (outil de dev, non publié) :
//   vm-test.html?ids=bow,harpoon&z=2&skin=2&cloth=0   (tous les états et images de chaque arme, posés comme en jeu)
//   &only=fire        : un seul état ;   &raw : le canvas 200x130 seul, sans décor
//   capture : node tools/vmshot.mjs <fichier.png> "<requête>"
import * as A from './js/fpsart.js';
import './js/fpsvm/index.js';
import { WEAPONS, MELEE, THROWN } from './js/fpsgame.js';
import { SKIN, CLOTH_COLORS } from './js/data.js';
window.onerror = (m, s, l, c, e) => { (window.errs ||= []).push(String(e?.stack || m)); };
const ce = console.error; console.error = (...a) => { (window.errs ||= []).push(a.map((x) => x?.stack || String(x)).join(' ')); ce(...a); };
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || 'colt').split(',');
const z = +(q.get('z') || 2), raw = q.has('raw'), only = q.get('only');
const skin = SKIN[+(q.get('skin') ?? 1)] || SKIN[1], cloth = CLOTH_COLORS[+(q.get('cloth') ?? 2)] || CLOTH_COLORS[2];
const W = 384, H = 216, VM_X = 12;
const statesOf = (id) => THROWN[id] || id === 'dynamite' ? [['idle', 1], ['lit', 2], ['throw', 1]]
  : MELEE.includes(id) ? [['idle', id === 'lasso' ? 2 : 1], ['swing', 3]]
    : id === 'bow' ? [['idle', 1], ['draw', 2], ['fire', 2], ['reload', 3]]
      : [['idle', 1], ['fire', id === 'gatling' ? 4 : 2], ['reload', 3], ...(WEAPONS[id]?.alt ? [['alt', 2]] : []), ...(WEAPONS[id]?.fan ? [['fan', 2]] : [])];
const grid = document.getElementById('grid');
for (const id of ids) for (const [st, n] of statesOf(id)) {
  if (only && st !== only) continue;
  for (let f = 0; f < n; f++) {
    let cv = null;
    const t0 = performance.now();
    try { cv = A.viewModel(id, st, f, skin, cloth); } catch (e) { (window.errs ||= []).push(`${id} ${st} ${f}: ${e.stack}`); }
    const ms = Math.round(performance.now() - t0);
    const box = grid.appendChild(document.createElement('div'));
    const k = box.appendChild(document.createElement('canvas'));
    k.width = raw ? 200 : W; k.height = raw ? 130 : H;
    k.style.cssText = `width:${k.width * z}px;height:${k.height * z}px;image-rendering:pixelated;display:block`;
    const c = k.getContext('2d');
    if (raw) { c.fillStyle = '#6a8a9a'; c.fillRect(0, 0, 200, 130); }
    else {
      // un décor neutre : ciel, horizon, sol de terre battue, et le viseur
      const sky = c.createLinearGradient(0, 0, 0, H / 2); sky.addColorStop(0, '#e8a060'); sky.addColorStop(1, '#f4d090');
      c.fillStyle = sky; c.fillRect(0, 0, W, H / 2);
      c.fillStyle = '#9a6a3c'; c.fillRect(0, H / 2, W, H / 2);
      c.fillStyle = '#7a4e2a'; for (let y = H / 2; y < H; y += 6) c.fillRect(0, y, W, 1);
      c.fillStyle = '#5a6a3a'; c.fillRect(60, H / 2 - 30, 40, 30); c.fillStyle = '#6a3a1a'; c.fillRect(270, H / 2 - 50, 60, 50);
      c.fillStyle = '#fff'; c.fillRect(W / 2 - 1, H / 2, 3, 1); c.fillRect(W / 2, H / 2 - 1, 1, 3);
    }
    if (cv) c.drawImage(cv, raw || cv.width >= W ? 0 : Math.round(W / 2 - cv.width / 2 + VM_X), raw ? 0 : H - cv.height); // plein écran (arc) : posé en x = 0
    else { c.fillStyle = '#f0f'; c.fillText('null', 10, 20); }
    const lab = box.appendChild(document.createElement('div'));
    lab.textContent = `${id} ${st} ${f}  ${cv ? `${cv.width}x${cv.height}` : 'NULL'} ${ms}ms`;
  }
}
document.getElementById('errlog').textContent = (window.errs || []).join('\n');
window.done = true;
</script></body></html>
